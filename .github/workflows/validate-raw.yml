name: Validate raw MVideo images

on:
  push:
    paths:
      - '.github/workflows/validate-raw.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all 103 raw.githubusercontent.com URLs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'images/*.jpg' | sort)
          echo "Files: ${#files[@]}"
          test "${#files[@]}" -eq 103
          ok=0
          for f in "${files[@]}"; do
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${f}"
            tmp="$(mktemp)"
            code="$(curl -L -sS --fail --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -w '%{http_code}' -o "$tmp" "$url")"
            test "$code" = "200"
            test -s "$tmp"
            mime="$(file -b --mime-type "$tmp")"
            case "$mime" in
              image/jpeg|image/png|image/webp) ;;
              *) echo "Bad MIME $mime for $url"; exit 1 ;;
            esac
            size="$(stat -c%s "$tmp")"
            test "$size" -le 10485760
            rm -f "$tmp"
            ok=$((ok+1))
          done
          echo "RAW_OK=$ok"
          test "$ok" -eq 103
