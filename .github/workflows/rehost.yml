name: Rehost MVideo images

on:
  push:
    paths:
      - '.github/workflows/rehost.yml'

permissions:
  contents: write

jobs:
  rehost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate 103 images
        shell: bash
        run: |
          set -euo pipefail
          rm -rf images
          mkdir -p images
          n=0
          while IFS=$'\t' read -r path url; do
            [ -z "${path:-}" ] && continue
            mkdir -p "$(dirname "$path")"
            tmp="${path}.tmp"
            curl -L --fail --retry 4 --retry-all-errors --connect-timeout 20 --max-time 120 "$url" -o "$tmp"
            test -s "$tmp"
            mime="$(file -b --mime-type "$tmp")"
            case "$mime" in
              image/jpeg|image/png|image/webp) ;;
              *) echo "Unexpected MIME $mime for $path"; exit 1 ;;
            esac
            size="$(stat -c%s "$tmp")"
            if [ "$size" -gt 10485760 ]; then
              echo "File too large: $path $size"
              exit 1
            fi
            mv "$tmp" "$path"
            n=$((n+1))
          done < rehost-manifest.tsv
          echo "Downloaded $n files"
          test "$n" -eq 103
          actual="$(find images -type f | wc -l | tr -d ' ')"
          test "$actual" -eq 103
      - name: Commit hosted images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Rehost M.Video images for retry14"
          git push
