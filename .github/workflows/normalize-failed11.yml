name: Normalize remaining 11 MVideo offers

on:
  push:
    paths:
      - '.github/workflows/normalize-failed11.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Re-encode exact 77 images to real baseline RGB JPEG
        shell: bash
        run: |
          set -euo pipefail
          rm -rf normalized
          mkdir -p normalized

          eans=(
            4009839426155
            4009839426117
            4009839496394
            4052025459215
            6971071270033
            5028420006797
            4009839336423
            4009839670145
            4009839306570
            4000530492173
            4052025923037
          )

          count=0
          for ean in "${eans[@]}"; do
            for src in images/${ean}_*.jpg; do
              test -f "$src"
              dst="normalized/$(basename "$src")"
              convert "$src"                 -auto-orient                 -colorspace sRGB                 -strip                 -interlace none                 -sampling-factor 4:2:0                 -quality 92                 "$dst"

              test -s "$dst"
              mime="$(file -b --mime-type "$dst")"
              test "$mime" = "image/jpeg"
              size="$(stat -c%s "$dst")"
              test "$size" -le 10485760

              count=$((count+1))
            done
          done

          echo "NORMALIZED_COUNT=$count"
          test "$count" -eq 77
          test "$(find normalized -type f -name '*.jpg' | wc -l | tr -d ' ')" -eq 77

      - name: Commit normalized images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add normalized
          git commit -m "Normalize M.Video failed11 images to baseline JPEG"
          git push
