name: Validate normalized failed11 raw URLs

on:
  push:
    paths:
      - '.github/workflows/validate-normalized11.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact 77 normalized raw URLs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files 'normalized/*.jpg' | sort)
          echo "Files: ${#files[@]}"
          test "${#files[@]}" -eq 77
          ok=0
          for f in "${files[@]}"; do
            url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/${f}"
            tmp="$(mktemp)"
            code="$(curl -L -sS --fail --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -w '%{http_code}' -o "$tmp" "$url")"
            test "$code" = "200"
            test -s "$tmp"
            mime="$(file -b --mime-type "$tmp")"
            test "$mime" = "image/jpeg"
            size="$(stat -c%s "$tmp")"
            test "$size" -le 10485760
            rm -f "$tmp"
            ok=$((ok+1))
          done
          echo "NORMALIZED_RAW_OK=$ok"
          test "$ok" -eq 77
